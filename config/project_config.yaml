project:
  title: "Singapore Rainfall Analysis and 30-Minute Rainfall Probability Prediction"
  course: "DSA5208 — Scalable Distributed Computing for Data Science"
  institution: "National University of Singapore (NUS)"
  timezone: "Asia/Singapore"
  seed: 42

environment:
  spark_app_name: "RainCastSG"
  spark_master: "local[*]"
  driver_memory: "6g"
  executor_memory: "6g"
  shuffle_partitions: 16
  sql_execution_arrow_pyspark_enabled: true
  log_level: "WARN"

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  samples_dir: "data/samples"
  years: [2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
  source_collection_url: "https://data.gov.sg/collections/2279/view"
  expected_measurement_type: "TB1 Rainfall 5 Minute Total F"
  expected_unit: "mm"
  interval_minutes: 5

splits:
  train_years: [2017, 2018, 2019, 2020, 2021, 2022]
  val_years: [2023]
  test_years: [2024]

features:
  target_lead_minutes: 30
  target_lead_intervals: 6  # 6 * 5 min = 30 min future accumulation
  historical_lags_minutes: [5, 15, 30, 60]
  historical_lags_intervals: [1, 3, 6, 12]
  thresholds: [0.0, 1.0, 2.0, 5.0, 10.0]

models:
  save_dir: "models"
  outputs_dir: "outputs"
  figures_dir: "figures"
  reports_dir: "reports"
  logistic_regression:
    max_iter: 100
    reg_param: 0.01
    elastic_net_param: 0.0
  random_forest:
    num_trees: 50
    max_depth: 10
    feature_subset_strategy: "auto"
  gbt:
    max_iter: 40
    max_depth: 5
    step_size: 0.1
  dev_sample_fraction: 0.05
